<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Page Layout</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }
    body{
        margin: 0;
        padding: 20px;
    }
    h1{
        font-size: 40px;
        margin-bottom: 30px;
    }
    .container{
        height: 280px;
        display: flex;
        flex-direction: column;
    }
    .header{
        height: 60px;
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;
        color: rgb(3, 3, 3);
        font: 24px;
        font-weight: bold;
    }
    .item{
        flex: 1;
        background-color: rgb(3, 3, 3);
    }
    .footer{
        height: 60px;
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;
        color: rgb(3, 3, 3);
        font: 24px;
        font-weight: bold;
    }

    
</style>
<body>
    <h1>Page Layout using Flexbox</h1>
    <div class="container">
        <div class="header">Header</div>
        <div class="item"></div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
